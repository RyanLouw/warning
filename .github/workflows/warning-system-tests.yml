name: Warning system tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warning-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Warning system tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          # Synthetic credential for this job's disposable SQL Server only.
          MSSQL_SA_PASSWORD: Test_only_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test_only_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      TEST_SQLSERVER: 'Server=localhost,1433;Database=master;User Id=sa;Password=Test_only_Passw0rd!;TrustServerCertificate=True'
      TEST_DATABASE_PROVIDER: SqlServer
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore test dependencies
        run: dotnet restore warningchat/WarningSystems.Tests.slnx -p:EnableCentralConfig=false
      - name: Build test host and tests
        run: dotnet build warningchat/WarningSystems.Tests.slnx -c Release --no-restore -p:EnableCentralConfig=false
      - name: Install headless Chromium
        shell: pwsh
        run: ./warningchat/tests/WarningSystems.UiTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Unit, SQL Server integration, and Playwright tests
        run: >-
          dotnet test warningchat/WarningSystems.Tests.slnx
          -c Release --no-build --no-restore -p:EnableCentralConfig=false
          --settings warningchat/tests/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx"
          --results-directory TestResults
      - name: Merge coverage and enforce baseline
        if: always()
        run: |
          dotnet tool restore
          dotnet reportgenerator '-reports:TestResults/**/coverage.cobertura.xml' '-targetdir:TestResults/coverage' '-reporttypes:Html;Cobertura;JsonSummary;TextSummary'
          python3 scripts/check-coverage.py TestResults/coverage/Cobertura.xml
          cat TestResults/coverage/Summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results, coverage, screenshots, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warning-system-test-results
          path: |
            TestResults/
            warningchat/**/TestResults/
          if-no-files-found: error
          retention-days: 14
